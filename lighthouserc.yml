# Lighthouse CI configuration for the accessibility CI gate.
#
# Thresholds mirror docs/nfrs.md (NFR-PERF-003, NFR-A11Y-004) exactly — do not
# change these numbers here without updating that document too:
#   - Accessibility category score >= 0.9 (Lighthouse score >= 90)
#   - Largest Contentful Paint (LCP)  <= 2500 ms
#   - Cumulative Layout Shift (CLS)   <= 0.1
#   - Interaction to Next Paint (INP) <= 200 ms
#
# The frontend server is built and served by the calling workflow
# (.github/workflows/accessibility.yml) before this config is used, so no
# `startServerCommand` is configured here — `collect.url` points at the
# already-running preview server. Port 5173 matches the frontend dev server
# port (frontend/vite.config.ts) and e2e/playwright.config.ts's baseURL, so
# `vite preview` is started with `--port 5173` in CI to keep all three in sync.
ci:
  collect:
    url:
      - 'http://localhost:5173/'
    numberOfRuns: 3
  assert:
    assertions:
      'categories:accessibility': ['error', { minScore: 0.9 }]
      'largest-contentful-paint': ['error', { maxNumericValue: 2500 }]
      'cumulative-layout-shift': ['error', { maxNumericValue: 0.1 }]
      'interaction-to-next-paint': ['error', { maxNumericValue: 200 }]
  upload:
    target: temporary-public-storage
