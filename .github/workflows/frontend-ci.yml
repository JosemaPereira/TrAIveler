# Frontend CI Workflow - Lint, Test, Build, and Accessibility
#
# This workflow runs on pull requests and pushes that modify frontend code.
# It validates code quality, runs tests, builds production bundle, and checks accessibility.
#
# Workflow steps:
# 1. Lint - Run ESLint and Prettier to enforce code style
# 2. Test - Execute Vitest unit and component tests
# 3. Build - Build production bundle with Vite
# 4. Accessibility - Run Lighthouse CI audit (WCAG 2.1 AA)
# 5. Deploy (main only) - Sync to S3 and invalidate CloudFront (placeholder for Sprint 10)
#
# Status: SKELETON - Jobs defined, deployment placeholder for future sprints
# Sprint 1 deliverable: lint, test, build, and accessibility jobs functional

name: Frontend CI

# No `paths:` filter on pull_request: a required status check whose workflow
# never triggers (path-filtered out) gets stuck at "Expected" and blocks
# merging forever — GitHub's own guidance is to always trigger the workflow
# and gate individual jobs with `if:` instead (a skipped job counts as a
# passing required check, unlike a check that never reports at all). See the
# `changes` job below.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

# Prevent concurrent runs on the same PR
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  lint:
    name: Lint Frontend Code
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
      
      - name: Check Prettier formatting
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

  test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run tests with coverage
        working-directory: frontend
        run: npm test -- --coverage --run
      
      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  build:
    name: Build Production Bundle
    runs-on: ubuntu-latest
    needs: [changes, lint, test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build production bundle
        working-directory: frontend
        env:
          # Use placeholder API URL for build validation
          # Actual deployment will use environment-specific URLs
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build
      
      - name: Check bundle size
        working-directory: frontend
        run: |
          BUNDLE_SIZE=$(du -sh dist | cut -f1)
          echo "Production bundle size: $BUNDLE_SIZE"
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium
      
      # TODO: Implement Lighthouse CI with @lhci/cli. Not scheduled for Sprint 2 — the
      # underlying roadmap tasks (002-T002, 002-T004, 002-T024) currently sit unscheduled
      # or in Sprint 9 (docs/roadmap.md), not Sprint 2. Re-check at Sprint 3 planning
      # whether to pull this forward (see .github/memory/session-notes.md, 2026-07-10).
      # For now, run a basic Playwright accessibility check as placeholder
