# Frontend CI Workflow - Lint, Test, Build, and Accessibility Audit
#
# This workflow runs on pull requests and pushes that modify frontend code.
# It validates code quality, runs tests, builds the production bundle, and —
# on pull requests — runs the accessibility gate (Playwright @accessibility
# specs + Lighthouse CI) against that same bundle.
#
# Consolidation note (2026-07-16): the former separate lint/test/build jobs
# were merged into one `quality` job (they shared identical checkout +
# setup-node + npm ci setup, tripling it per PR), and the former standalone
# accessibility.yml workflow was folded in as the `accessibility` job below.
# The a11y job reuses the `frontend-dist` artifact produced by `quality`
# instead of rebuilding the same bundle a second time. The `Accessibility
# Audit` job name is pinned as a required status check in the "Protect main"
# ruleset — do not rename it.
#
# Workflow steps:
# 1. Quality - ESLint + Prettier, Vitest (with the 90% coverage gate from
#    vitest.config.ts), and the Vite production build
# 2. Accessibility (PRs only) - Serve the built bundle, run Playwright
#    accessibility specs (`--grep @accessibility`) from e2e/, then Lighthouse
#    CI. Thresholds live in lighthouserc.yml (repo root) and mirror
#    docs/nfrs.md NFR-PERF-003 / NFR-A11Y-004 exactly.
# 3. Deploy (main only) - Sync to S3 and invalidate CloudFront (placeholder
#    for Sprint 10)

name: Frontend CI

# No `paths:` filter on pull_request: a required status check whose workflow
# never triggers (path-filtered out) gets stuck at "Expected" and blocks
# merging forever — GitHub's own guidance is to always trigger the workflow
# and gate individual jobs with `if:` instead (a skipped job counts as a
# passing required check, unlike a check that never reports at all). See the
# `changes` job below.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/detect-changes.yml'
  workflow_dispatch:

# Least-privilege token: the `changes` job (delegated to detect-changes.yml, shared with
# backend-ci.yml/infra-plan.yml) needs pull-requests:read for dorny/paths-filter to list a PR's
# changed files via the API (otherwise it fails with "Resource not accessible by integration");
# checkout needs contents:read. statuses:write lets the `accessibility` job's Lighthouse CI step
# publish its own GitHub status check (LHCI_GITHUB_TOKEN below) instead of only reporting via the
# job's own exit code.
permissions:
  contents: read
  pull-requests: read
  statuses: write

# Prevent concurrent runs on the same PR
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `a11y` is a superset of the frontend paths: the accessibility job also cares about e2e/ specs
  # and the Lighthouse config. The quality job is gated on `a11y` too, because the accessibility
  # job consumes its frontend-dist artifact and must be able to depend on it existing.
  changes:
    uses: ./.github/workflows/detect-changes.yml

  quality:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.a11y == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Run tests with coverage
        working-directory: frontend
        run: npm test -- --coverage --run

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Build production bundle
        working-directory: frontend
        env:
          # Use placeholder API URL for build validation
          # Actual deployment will use environment-specific URLs
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          BUNDLE_SIZE=$(du -sh dist | cut -f1)
          echo "Production bundle size: $BUNDLE_SIZE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [changes, quality]
    # PRs only, matching the former standalone accessibility.yml (it had no
    # push trigger). Reuses quality's frontend-dist artifact instead of
    # rebuilding the bundle.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.a11y == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Only frontend/package-lock.json exists — e2e/package-lock.json is
          # deliberately gitignored (e2e/.gitignore), so e2e installs below use
          # `npm install` rather than `npm ci` and are not cached here.
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        # Still needed even though the bundle comes from the artifact: this
        # job runs `vite preview`, `wait-on`, and `lhci` from frontend's
        # devDependencies.
        working-directory: frontend
        run: npm ci

      - name: Download production bundle from quality job
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Serve frontend production build
        working-directory: frontend
        # Port 5173 matches frontend/vite.config.ts's dev server port and
        # e2e/playwright.config.ts's baseURL, so both the Playwright specs and
        # Lighthouse CI (lighthouserc.yml) hit the same URL.
        run: npx vite preview --port 5173 --strictPort &

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Install e2e dependencies
        working-directory: e2e
        # Not `npm ci`: e2e/package-lock.json is deliberately gitignored
        # (e2e/.gitignore), so there is no lockfile to install from.
        run: npm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install Playwright browser (chromium)
        # Skipped on cache hit: the binary download (not the OS deps below) is the slow part.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install chromium

      - name: Install Playwright OS dependencies
        # Always runs: apt packages aren't restored by actions/cache (the runner image itself
        # isn't cached), so this stays outside the cache-hit condition above.
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run Playwright accessibility specs
        working-directory: e2e
        # --pass-with-no-tests: no e2e spec is tagged `@accessibility` yet —
        # that's task 002-T023 (Sprint 9), which wires checkPageA11y(page)
        # into every e2e/*.spec.ts. Until then this step is a no-op pass
        # rather than a hard failure; once T023 lands, it starts actually
        # running (and gating on) those specs.
        run: npx playwright test --grep @accessibility --pass-with-no-tests

      - name: Run Lighthouse CI
        # Uses the @lhci/cli devDependency installed in frontend/ (T002) rather
        # than a version pinned separately here, so the CI version always
        # matches frontend/package.json's declared range.
        working-directory: frontend
        env:
          # @lhci/cli's yargs config reads any LHCI_-prefixed env var (cli.js's
          # `.env('LHCI')`) and maps it to the matching `upload.*` option — this
          # becomes the `githubToken` option, letting `lhci autorun`'s upload
          # step POST a commit status via the GitHub Statuses API instead of
          # printing "No GitHub token set, skipping GitHub status check."
          # Requires `statuses: write` above; no separate secret to create,
          # the auto-issued per-run GITHUB_TOKEN already covers this repo.
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx lhci autorun --config=../lighthouserc.yml

