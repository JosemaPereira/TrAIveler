# Backend CI Workflow - Lint, Test, and Build
#
# This workflow runs on pull requests and pushes that modify backend code.
# It validates code quality, runs tests, and builds a Docker image for deployment.
#
# Workflow steps:
# 1. Lint & Test - golangci-lint, then Go tests with race detection and
#    coverage, then a swagger-drift check confirming backend/docs/ matches
#    what `make swagger` would regenerate right now, then a roadmap-status
#    drift check confirming docs/roadmap.md's Status column agrees with the
#    live GitHub state of each row's linked issue (one job: they shared
#    identical checkout/setup-go, and lint finishing first fails fast before
#    the slower test run)
# 2. Build - Build Docker image for linux/arm64 (ECS Fargate) to validate the
#    Dockerfile; the image is not pushed or persisted anywhere yet
# 3. Push (main only) - Push image to ECR (placeholder for Sprint 3)
# 4. Deploy (main only) - Update ECS service (placeholder for Sprint 10)
#
# Note: tests run via `make test-coverage`, which uses `-short` — every
# DB-backed test is testcontainer-gated and skips in short mode, so this
# workflow needs no PostgreSQL service container (one was configured here
# until 2026-07-16, but nothing ever connected to it).

name: Backend CI

# No `paths:` filter on pull_request: a required status check whose workflow
# never triggers (path-filtered out) gets stuck at "Expected" and blocks
# merging forever — GitHub's own guidance is to always trigger the workflow
# and gate individual jobs with `if:` instead (a skipped job counts as a
# passing required check, unlike a check that never reports at all). See the
# `changes` job below.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

# Least-privilege token: dorny/paths-filter needs pull-requests:read to list a
# PR's changed files via the API (otherwise the changes job fails with
# "Resource not accessible by integration"); checkout needs contents:read;
# the roadmap-status-drift step's `gh issue list` needs issues:read.
permissions:
  contents: read
  pull-requests: read
  issues: read

# Prevent concurrent runs on the same PR
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: backend
          args: --timeout=5m

      - name: Run tests with coverage
        # Short mode: testcontainer-gated tests skip; no live database is
        # needed here (see the note in this file's header).
        working-directory: backend
        run: |
          make test-coverage
          go tool cover -func=coverage.out

      - name: Check Swagger docs are up to date
        # Regenerates backend/docs/ from the swag doc-comment annotations and
        # fails if the committed output differs — a stale contract is a bug,
        # not a style nit (see docs/testing-guidelines.md's "Validation Gates
        # Beyond the Three Testing Layers" section).
        working-directory: backend
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          make swagger
          git diff --exit-code -- docs

      - name: Check roadmap Status matches live GitHub issue state
        # Catches a row nobody flipped after its tracking issue closed
        # (closed-but-not-{Done,Superseded}) — see
        # scripts/check-roadmap-status-drift.py for why the reverse
        # (open-but-Done) is deliberately not checked.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-roadmap-status-drift.py

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [changes, lint-test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract metadata
        id: meta
        run: |
          # Use git SHA for development builds
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
      
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: |
            traveler-backend:${{ steps.meta.outputs.version }}
            traveler-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No `outputs:`/artifact upload: nothing consumes the image until
          # the ECR push job (Sprint 3) exists — this job only validates that
          # the Dockerfile builds. The push job below will rebuild from the
          # warm GHA layer cache when it lands.

