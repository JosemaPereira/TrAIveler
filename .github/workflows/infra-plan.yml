# Infrastructure CI Workflow - Terraform Validation and Planning
#
# This workflow runs on pull requests that modify infrastructure code.
# It validates Terraform syntax, checks formatting, and generates a plan
# for review before infrastructure changes are applied.
#
# Workflow steps:
# 1. Validate - Format check (`terraform fmt -check`) plus HCL syntax and
#    configuration validity (real, no AWS credentials needed:
#    `terraform init -backend=false` skips the remote S3/DynamoDB backend
#    entirely, so this runs unconditionally). Formatting was a separate job
#    until 2026-07-16; it shared the exact checkout/setup-terraform setup, so
#    it is now a step here.
# 2. Plan - Generate execution plans for staging and production, posted as
#    a PR comment (needs the real S3/DynamoDB remote-state backend, issue
#    #96/003-T009, and real AWS credentials via OIDC, issue #92/005-T109 —
#    neither exists yet, so the AWS-touching steps are gated behind the
#    `AWS_ROLE_ARN` repository secret and are a no-op until both are
#    provisioned; see "AWS-cost-avoidance constraint" in docs/roadmap.md)
#
# Status: 005-T107 (issue #91) — validate (incl. format check) is fully
# real; plan is real but gated inert pending AWS credentials + remote-state
# backend. Do not rename the `validate`/`plan` job `name:` fields — they
# are the exact strings pinned as required status checks in this repo's
# branch-protection ruleset
# (.github/memory/patterns-discovered.md, "New Workflow's Required Status
# Check Stuck at 'Expected' — Verify the Job `name:` Against the Live
# Ruleset").

name: Infrastructure Plan

# No `paths:` filter on pull_request: a required status check whose workflow
# never triggers (path-filtered out) gets stuck at "Expected" and blocks
# merging forever — GitHub's own guidance is to always trigger the workflow
# and gate individual jobs with `if:` instead (a skipped job counts as a
# passing required check, unlike a check that never reports at all). See the
# `changes` job below.
on:
  pull_request:
  workflow_dispatch:

# Least-privilege default token: the `changes` job (delegated to detect-changes.yml, shared with
# backend-ci.yml/frontend-ci.yml) needs pull-requests:read for dorny/paths-filter to list a PR's
# changed files via the API, else it fails with "Resource not accessible by integration". The
# terraform-plan job sets its own job-level permissions (id-token/pull-requests:write for OIDC + PR
# comments), which fully override this default for that job.
permissions:
  contents: read
  pull-requests: read

# Prevent concurrent runs on the same PR
concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.infra == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Init (local only, no remote backend)
        # -backend=false skips configuring the S3/DynamoDB backend declared
        # in infra/backend.tf entirely, so this needs zero AWS credentials
        # and zero real AWS resources — safe to run unconditionally.
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Format Check
        # Fails if any .tf file needs formatting.
        run: |
          cd infra
          terraform fmt -check -recursive

      - name: Terraform Validate
        # Validates the root module and, transitively, every module it
        # calls (vpc, alb, ecs, rds, cloudfront, secrets) — one command
        # covers the whole module tree, since `terraform validate` follows
        # module blocks. Does not require -var-file: validate only checks
        # HCL syntax and internal consistency, not variable values.
        run: |
          cd infra
          terraform validate

  plan:
    name: Terraform Plan (Staging)
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.infra == 'true'

    # id-token: write is required by aws-actions/configure-aws-credentials
    # for OIDC federation (005-T109); pull-requests: write is required to
    # post the plan-output PR comment.
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    # Secrets cannot be referenced directly in step `if:` conditions (the
    # `secrets` context is not available there — only in `env:`/`with:`/
    # `run:`), so mirror the secret into a job-level env var here and gate
    # every AWS-touching step below on `env.AWS_ROLE_ARN != ''` instead.
    # Until issue #92 (005-T109, OIDC role) and issue #96 (003-T009, S3/
    # DynamoDB backend) are provisioned for real, this secret does not
    # exist, every gated step below is skipped (not failed), and this
    # required check still reports success — same "skipped job/step counts
    # as a passing required check" mechanism as
    # `.github/memory/patterns-discovered.md`'s "Required Status Checks
    # Must Always Run" pattern, applied at the step level here since only
    # part of this job needs to be inert.
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        if: env.AWS_ROLE_ARN != ''
        working-directory: infra
        run: terraform init

      - name: Terraform Plan (Staging)
        if: env.AWS_ROLE_ARN != ''
        working-directory: infra
        run: terraform plan -var-file=environments/staging.tfvars -out=tfplan-staging -no-color | tee plan-staging.txt

      - name: Terraform Plan (Production)
        if: env.AWS_ROLE_ARN != ''
        working-directory: infra
        run: terraform plan -var-file=environments/production.tfvars -out=tfplan-production -no-color | tee plan-production.txt

      - name: No-op notice (AWS credentials not yet provisioned)
        if: env.AWS_ROLE_ARN == ''
        run: |
          echo "AWS_ROLE_ARN secret is not set — skipping real terraform init/plan."
          echo "This is expected until issue #92 (005-T109, OIDC role) and issue #96"
          echo "(003-T009, S3/DynamoDB remote-state backend) are provisioned for real."
          echo "See infra/README.md's 'OIDC Authentication' section and this repo's"
          echo "AWS-cost-avoidance constraint in docs/roadmap.md."

      - name: Comment Plan on PR
        if: env.AWS_ROLE_ARN != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const staging = fs.readFileSync('infra/plan-staging.txt', 'utf8');
            const production = fs.readFileSync('infra/plan-production.txt', 'utf8');
            const output = `#### Terraform Plan

            <details><summary>Staging</summary>

            \`\`\`
            ${staging}
            \`\`\`

            </details>

            <details><summary>Production</summary>

            \`\`\`
            ${production}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
