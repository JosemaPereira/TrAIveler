# Infrastructure CI Workflow - Terraform Validation and Planning
#
# This workflow runs on pull requests that modify infrastructure code.
# It validates Terraform syntax, checks formatting, and generates a plan
# for review before infrastructure changes are applied.
#
# Workflow steps:
# 1. Validate - Check HCL syntax and configuration validity
# 2. Format Check - Ensure consistent code formatting
# 3. Plan - Generate execution plan for staging environment
#
# Status: SKELETON - Jobs defined without full implementation
# Sprint 1 deliverable: workflow structure with placeholders

name: Infrastructure Plan

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-plan.yml'
  workflow_dispatch:

# Prevent concurrent runs on the same PR
concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
      
