# Mockery configuration for automated mock generation
# Run: make mocks
# Or: mockery --all
#
# Standard: Mocks are generated in a /mocks subdirectory relative to the interface
# Example: internal/database/client.go → internal/database/mocks/client_mock.go

# Global settings
quiet: false
with-expecter: true
dir: "{{.InterfaceDir}}/mocks"
filename: "{{.InterfaceName | snakecase}}_mock.go"
mock-build-tags: "test"

# Package configurations
packages:
  github.com/JosemaPereira/TrAIveler/backend/internal/database:
    interfaces:
      Client:
  github.com/JosemaPereira/TrAIveler/backend/internal/ai:
    interfaces:
      AIClient:
  github.com/JosemaPereira/TrAIveler/backend/internal/middleware:
    interfaces:
      TokenValidator:
  github.com/JosemaPereira/TrAIveler/backend/internal/subscription:
    interfaces:
      Repository:
  github.com/JosemaPereira/TrAIveler/backend/internal/trip:
    interfaces:
      Repository:
      Manager:
  github.com/JosemaPereira/TrAIveler/backend/internal/conversation:
    interfaces:
      Repository:
      Manager:
  github.com/JosemaPereira/TrAIveler/backend/internal/subscription/payment:
    interfaces:
      PaymentProvider:
  github.com/JosemaPereira/TrAIveler/backend/internal/auth:
    interfaces:
      UserRepository:
      RefreshTokenRepository:
      AccountService:
