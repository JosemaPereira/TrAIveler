basePath: /api/v1
definitions:
  auth.CurrentUserResponse:
    properties:
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      payment_method_token:
        type: string
    type: object
  auth.RegisterResponse:
    properties:
      subscription:
        $ref: '#/definitions/subscription.Subscription'
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      has_subscription:
        type: boolean
      id:
        type: string
    type: object
  auth.invalidRequestEnvelope:
    properties:
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  auth.refreshResponse:
    properties:
      message:
        type: string
    type: object
  conversation.HistoryResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/conversation.Message'
        type: array
      session_id:
        type: string
      status:
        type: string
    type: object
  conversation.Message:
    properties:
      content:
        type: string
      id:
        type: string
      role:
        type: string
      session_id:
        type: string
      timestamp:
        type: string
      token_count:
        type: integer
    type: object
  conversation.SendMessageRequest:
    properties:
      message:
        type: string
    type: object
  conversation.SendMessageResponse:
    properties:
      itinerary_ready:
        type: boolean
      message:
        type: string
      role:
        type: string
      session_id:
        type: string
    type: object
  conversation.invalidRequestEnvelope:
    properties:
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  errors.ErrorResponse:
    properties:
      details:
        additionalProperties: {}
        type: object
      error:
        type: string
      fields:
        items:
          $ref: '#/definitions/errors.ValidationError'
        type: array
      message:
        type: string
      request_id:
        type: string
    type: object
  errors.ValidationError:
    properties:
      error:
        type: string
      field:
        type: string
    type: object
  subscription.Subscription:
    properties:
      cancelled_at:
        type: string
      created_at:
        type: string
      current_period_end:
        type: string
      current_period_start:
        type: string
      grace_period_ends_at:
        type: string
      id:
        type: string
      plan_id:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  trip.CreateTripRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  trip.ListResponse:
    properties:
      trips:
        items:
          $ref: '#/definitions/trip.Trip'
        type: array
    type: object
  trip.Response:
    properties:
      trip:
        $ref: '#/definitions/trip.Trip'
    type: object
  trip.Trip:
    properties:
      archived:
        type: boolean
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  trip.UpdateTripRequest:
    properties:
      description:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  trip.invalidRequestEnvelope:
    properties:
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
info:
  contact: {}
  description: Machine-readable OpenAPI contract for the TrAIveler backend API, generated
    from Go doc-comment annotations colocated with each handler (see specs/009-api-documentation/).
  title: TrAIveler API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user and, on success, sets an access/refresh token pair as HTTP-only,
        Secure, SameSite=Strict cookies. Unknown email and wrong password return an identical
        401 (no account enumeration); repeated failures trigger a progressive-delay 429.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.invalidRequestEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      description: |-
        Revokes the presented refresh token and clears both session cookies. Idempotent: a
        missing or already-revoked refresh token still clears cookies and returns 204.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      description: |-
        Returns the account behind the access_token cookie. This is how a freshly loaded
        page learns who is signed in: the session cookies are HTTP-only, so the browser
        cannot read them, and no user data survives a reload client-side. The record is read
        from the database, so has_subscription reflects the current state rather than the
        possibly-stale claim baked into the access token. A token whose account no longer
        exists returns the uniform 401 rather than a 404 — the session is dead, not the
        resource. The 401's error code tells the client what to do next:
        authentication_required (no token, an invalid one, or a deleted account) means log
        in again, while token_expired — emitted only for a validly-signed but expired token
        — means refresh and retry.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get the authenticated account
      tags:
      - auth
  /auth/refresh:
    post:
      description: |-
        Exchanges the refresh_token cookie for a new access token and a rotated refresh
        token, both set as HTTP-only, Secure, SameSite=Strict cookies. Public by design: it
        authenticates with the refresh cookie, not an access token. A missing, expired, or
        already-used refresh token returns the uniform 401 authentication_required envelope.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.refreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Refresh the session
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new user (admin role). When a payment_method_token is supplied a
        subscription is activated and has_subscription is true; otherwise the user is a
        Free User (has_subscription false). On success an access/refresh token pair is set as
        HTTP-only, Secure, SameSite=Strict cookies. Rate-limited per client IP.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.invalidRequestEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Register a new account
      tags:
      - auth
  /trips:
    get:
      description: Returns every non-archived trip owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.ListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List trips
      tags:
      - trips
    post:
      consumes:
      - application/json
      description: |-
        Creates a new draft trip owned by the authenticated user. Only an admin may create a
        trip; any other role is rejected with 403 forbidden.
      parameters:
      - description: Trip payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/trip.CreateTripRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/trip.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/trip.invalidRequestEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create a trip
      tags:
      - trips
  /trips/{id}:
    delete:
      description: |-
        Deletes the trip identified by id (cascading to its days/activities/conversation
        sessions), provided the authenticated user is its creator and currently holds a
        strictly active subscription.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete a trip
      tags:
      - trips
    get:
      description: |-
        Returns the trip identified by id, provided the authenticated user owns it. A trip
        owned by someone else is reported as 404, not 403, so a non-owner cannot distinguish
        "doesn't exist" from "exists but isn't yours" (anti-enumeration).
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get a trip
      tags:
      - trips
    put:
      consumes:
      - application/json
      description: |-
        Updates title/description/status for the trip identified by id, provided the
        authenticated user is its creator and currently holds an active-or-grace-period
        subscription. Requires an If-Match header carrying the trip's current version
        (optimistic locking); a stale version returns 409 conflict.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: string
      - description: Current trip version
        in: header
        name: If-Match
        required: true
        type: string
      - description: Trip payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/trip.UpdateTripRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/trip.invalidRequestEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update a trip
      tags:
      - trips
  /trips/{id}/conversation:
    get:
      description: |-
        Returns the trip's most recent planning conversation session and its messages in
        chronological order.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.HistoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get conversation history
      tags:
      - conversation
    post:
      consumes:
      - application/json
      description: |-
        Appends a user message to the trip's planning conversation and returns the AI's next
        turn as a single Server-Sent Event. Continue is synchronous — one complete reply per
        turn, not token-by-token streaming — so exactly one "data:" frame is written.
        itinerary_ready signals the conversation has produced a persisted itinerary.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: string
      - description: User message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/conversation.SendMessageRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.SendMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/conversation.invalidRequestEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Send a conversation turn
      tags:
      - conversation
securityDefinitions:
  CookieAuth:
    description: 'Session authentication via the HTTP-only `access_token` cookie set
      by `POST /api/v1/auth/login`, `POST /api/v1/auth/register`, and `POST /api/v1/auth/refresh`.
      Send it as `Cookie: access_token=<jwt>`. The "Authorize" box cannot supply this
      credential — the cookie is HttpOnly and `Cookie` is a forbidden header for browser-issued
      requests — but Swagger UI is served from the same origin behind the same gate,
      so a browser that reached this page already holds the cookie and sends it automatically
      on every "Try it out" request.'
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
