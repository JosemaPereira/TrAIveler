info:
  contact: {}
  description: Machine-readable OpenAPI contract for the TrAIveler backend API, generated
    from Go doc-comment annotations colocated with each handler (see specs/009-api-documentation/).
  title: TrAIveler API
  version: "1.0"
paths:
  /examples:
    get:
      description: |-
        Returns a paginated list of example resources, optionally filtered by status.
        Validates page/per_page query params up front (400 on malformed or out-of-range
        values, per docs/api-design-standards.md §9) rather than silently clamping them.
      parameters:
      - description: Filter by status
        enum:
        - active
        - inactive
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example.listResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/example.invalidRequestEnvelope'
      security:
      - BearerAuth: []
      summary: List examples
      tags:
      - examples
    post:
      consumes:
      - application/json
      description: Creates an example resource for demonstration purposes
      parameters:
      - description: Example payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/example.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/example.Example'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/example.invalidRequestEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new example
      tags:
      - examples
  /examples/{id}:
    delete:
      description: |-
        Deletes an example resource by its ID, responding 204 with no body on success
        per docs/api-design-standards.md §8
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an example
      tags:
      - examples
    get:
      description: Retrieves a single example resource by its ID
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example.Example'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an example by ID
      tags:
      - examples
    put:
      consumes:
      - application/json
      description: |-
        Fully replaces an example resource (PUT semantics); the caller-known version is
        carried on the If-Match header rather than the request body, matching the
        concurrency-control convention documented for versioned entities in docs/data-model.md
        (Trip/Activity's "Concurrency Control" sections).
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      - description: Expected current version, for optimistic-locking concurrency
          control
        in: header
        name: If-Match
        required: true
        type: string
      - description: Example payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/example.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example.Example'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/example.invalidRequestEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an example
      tags:
      - examples
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
