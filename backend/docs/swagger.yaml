basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      payment_method_token:
        type: string
    type: object
  auth.RegisterResponse:
    properties:
      subscription:
        $ref: '#/definitions/subscription.Subscription'
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      has_subscription:
        type: boolean
      id:
        type: string
    type: object
  auth.invalidRequestEnvelope:
    properties:
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  errors.ErrorResponse:
    properties:
      details:
        additionalProperties: {}
        type: object
      error:
        type: string
      fields:
        items:
          $ref: '#/definitions/errors.ValidationError'
        type: array
      message:
        type: string
      request_id:
        type: string
    type: object
  errors.ValidationError:
    properties:
      error:
        type: string
      field:
        type: string
    type: object
  example.Example:
    properties:
      count:
        type: integer
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  example.createRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  example.invalidRequestEnvelope:
    properties:
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  example.listResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/example.Example'
        type: array
      pagination:
        $ref: '#/definitions/example.paginationEnvelope'
    type: object
  example.paginationEnvelope:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  example.updateRequest:
    properties:
      count:
        type: integer
      name:
        type: string
      status:
        type: string
    type: object
  subscription.Subscription:
    properties:
      cancelled_at:
        type: string
      created_at:
        type: string
      grace_period_ends_at:
        type: string
      id:
        type: string
      plan_id:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
info:
  contact: {}
  description: Machine-readable OpenAPI contract for the TrAIveler backend API, generated
    from Go doc-comment annotations colocated with each handler (see specs/009-api-documentation/).
  title: TrAIveler API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user and, on success, sets an access/refresh token pair as HTTP-only,
        Secure, SameSite=Strict cookies. Unknown email and wrong password return an identical
        401 (no account enumeration); repeated failures trigger a progressive-delay 429.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.invalidRequestEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      description: |-
        Revokes the presented refresh token and clears both session cookies. Idempotent: a
        missing or already-revoked refresh token still clears cookies and returns 204.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new user (admin role). When a payment_method_token is supplied a
        subscription is activated and has_subscription is true; otherwise the user is a
        Free User (has_subscription false). On success an access/refresh token pair is set as
        HTTP-only, Secure, SameSite=Strict cookies.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.invalidRequestEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Register a new account
      tags:
      - auth
  /examples:
    get:
      description: |-
        Returns a paginated list of example resources, optionally filtered by status.
        Validates page/per_page query params up front (400 on malformed or out-of-range
        values, per docs/api-design-standards.md §9) rather than silently clamping them.
      parameters:
      - description: Filter by status
        enum:
        - active
        - inactive
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example.listResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/example.invalidRequestEnvelope'
      security:
      - BearerAuth: []
      summary: List examples
      tags:
      - examples
    post:
      consumes:
      - application/json
      description: Creates an example resource for demonstration purposes
      parameters:
      - description: Example payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/example.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/example.Example'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/example.invalidRequestEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new example
      tags:
      - examples
  /examples/{id}:
    delete:
      description: |-
        Deletes an example resource by its ID, responding 204 with no body on success
        per docs/api-design-standards.md §8
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an example
      tags:
      - examples
    get:
      description: Retrieves a single example resource by its ID
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example.Example'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an example by ID
      tags:
      - examples
    put:
      consumes:
      - application/json
      description: |-
        Fully replaces an example resource (PUT semantics); the caller-known version is
        carried on the If-Match header rather than the request body, matching the
        concurrency-control convention documented for versioned entities in docs/data-model.md
        (Trip/Activity's "Concurrency Control" sections).
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      - description: Expected current version, for optimistic-locking concurrency
          control
        in: header
        name: If-Match
        required: true
        type: string
      - description: Example payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/example.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example.Example'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/example.invalidRequestEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an example
      tags:
      - examples
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
